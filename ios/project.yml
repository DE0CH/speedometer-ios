# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed). The app reads GPS speed from Core
# Location and shows it as one number. No server, no packages, no secrets.
name: Speedometer
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    BUILD_NUMBER: "1"
    SWIFT_VERSION: "5.9"
targets:
  Speedometer:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.speedometer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Speed
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Your speed comes from GPS. Nothing is stored or sent anywhere.
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSRequiresIPhoneOS: true
  SpeedometerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Speedometer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.speedometer.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Speedometer:
    build: { targets: { Speedometer: all, SpeedometerUITests: [test] } }
    test: { targets: [SpeedometerUITests] }
