# Builds the app on a GitHub macOS runner, walks every flow on an iPhone 17 simulator (the phone replica: simulated GPS
# fixes at 87 km/h, parked, 128 km/h, landscape, a stale fix, the unit toggle and its memory) and compares the SwiftUI
# screen with the HTML mock it was drawn from, state by state, then archives UNSIGNED
# and lets the export cloud-sign with Apple's managed distribution certificate (App Store Connect API key) and upload
# to TestFlight. A failing replica blocks the upload.
name: ios
on:
  workflow_dispatch:
    inputs:
      upload: { description: "Upload to TestFlight", type: boolean, default: true }
      appearance: { description: "Simulator appearance", type: choice, options: [light, dark], default: light }
  workflow_call:   # the appstore workflow runs the replica on an iPhone 17 Pro Max for the store screenshot
    inputs:
      upload: { type: boolean, default: false }
      appearance: { type: string, default: light }
      device: { type: string, default: iPhone 17 }
  push:
    branches: [main]
    paths: ["ios/**", "!ios/fastlane/**", ".github/workflows/ios.yml"]
permissions: { contents: read }
defaults:
  run:
    shell: bash -eo pipefail {0}
    working-directory: ios
jobs:
  build:
    runs-on: macos-26
    concurrency: { group: "ios-${{ inputs.device || 'iPhone 17' }}-${{ inputs.appearance || 'light' }}", cancel-in-progress: false }
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode, xcodegen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"; sudo xcode-select -s "$XCODE"; xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          sed -i '' "s/BUILD_NUMBER: \"1\"/BUILD_NUMBER: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate --quiet
      - name: Phone replica (simulator, every flow)
        timeout-minutes: 25
        env:
          DEVICE: ${{ inputs.device || 'iPhone 17' }}
          APPEARANCE: ${{ inputs.appearance || 'light' }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          rts=sorted((k for k in d if 'iOS' in k), key=lambda k:[int(x) for x in re.findall(r'\d+',k)])
          for rt in reversed(rts):
              for dev in d[rt]:
                  if dev['name']==sys.argv[1]: print(dev['udid']); sys.exit()
          " "$DEVICE")
          [ -n "$UDID" ] || { echo "no $DEVICE simulator"; exit 1; }
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl ui "$UDID" appearance "$APPEARANCE"
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          # Location permission up front; the test also answers the prompt if it shows.
          xcrun simctl privacy "$UDID" grant location dev.de0ch.speedometer || true
          ( sleep 1200; echo "watchdog: stopping xcodebuild" >> "$RUNNER_TEMP/test.log"; pkill -INT xcodebuild ) & WATCHDOG=$!
          mkdir -p "$RUNNER_TEMP/screens"
          COMMON=(-project Speedometer.xcodeproj -scheme Speedometer -configuration Release -destination "id=$UDID"
            -derivedDataPath DerivedData ONLY_ACTIVE_ARCH=YES ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO)
          xcodebuild build-for-testing "${COMMON[@]}" > "$RUNNER_TEMP/build.log" 2>&1 || true
          grep -E "error:|\*\* TEST BUILD" "$RUNNER_TEMP/build.log" | head -20 || true
          xcodebuild test-without-building "${COMMON[@]}" -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 > "$RUNNER_TEMP/test.log" 2>&1 || true
          kill $WATCHDOG 2>/dev/null || true
          tail -25 "$RUNNER_TEMP/test.log"
          grep -E "error:|\*\* TEST|Test Case .*(passed|failed)|XCTAssert" "$RUNNER_TEMP/test.log" | head -40 || true
          grep "COMPARE " "$RUNNER_TEMP/test.log" || true   # SwiftUI vs the HTML, per state
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/att" >/dev/null 2>&1 || true
          python3 - "$RUNNER_TEMP/att" "$RUNNER_TEMP/screens" <<'PY' || true
          import json, os, shutil, sys
          src, dst = sys.argv[1:]
          n = 0
          for t in json.load(open(os.path.join(src, "manifest.json"))):
              for a in t.get("attachments", []):
                  f = a.get("exportedFileName", "")
                  if f.endswith(".png"):
                      n += 1; shutil.copy(os.path.join(src, f), os.path.join(dst, "%02d-%s.png" % (n, a.get("suggestedHumanReadableName", f).split("_")[0])))
          print(f"screenshots: {n}")
          PY
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" "$RUNNER_TEMP/test.log"
      - name: Keep the replica screenshots and log
        if: always()
        continue-on-error: true   # a GitHub artifact-storage hiccup never blocks a release
        uses: actions/upload-artifact@v4
        with:
          name: replica-screens-${{ inputs.appearance || 'light' }}
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore
      - name: Archive (unsigned)
        if: inputs.upload || (github.event_name == 'push' && github.workflow == 'ios')
        run: |
          xcodebuild archive -project Speedometer.xcodeproj -scheme Speedometer -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1 || true
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" | head -40 || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
      - name: Export, cloud-sign and upload to TestFlight
        if: inputs.upload || (github.event_name == 'push' && github.workflow == 'ios')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"; trap 'rm -f "$KEY"' EXIT
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || true
          grep -E "error|EXPORT|Upload|Uploaded|uploaded" "$RUNNER_TEMP/export.log" | sed "s#$RUNNER_TEMP/##" | tail -n 25 || true
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" "$RUNNER_TEMP/export.log"
