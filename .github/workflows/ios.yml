# Builds the app on a GitHub macOS runner, walks every flow on an iPhone 17 simulator (the phone replica: simulated GPS
# fixes at 87 km/h, parked, 128 km/h, landscape, a stale fix, the unit toggle and its memory) and compares the native
# screen with the HTML mock it was drawn from, state by state, then archives UNSIGNED
# and lets the export cloud-sign with Apple's managed distribution certificate (App Store Connect API key) and upload
# to TestFlight. A failing replica blocks the upload.
name: ios
on:
  workflow_dispatch:
    inputs:
      upload: { description: "Upload to TestFlight", type: boolean, default: true }
      appearance: { description: "Simulator appearance", type: choice, options: [light, dark], default: light }
  workflow_call:   # the appstore workflow runs the replica on an iPhone 17 Pro Max for the store screenshot
    inputs:
      upload: { type: boolean, default: false }
      appearance: { type: string, default: light }
      device: { type: string, default: iPhone 17 }
      runner: { type: string, default: xcode-27 }   # the store screenshot's iPhone 17 Pro Max is on macos-26 only
  push:
    branches: [main]
    paths: ["ios/**", "!ios/fastlane/**", ".github/workflows/ios.yml"]
permissions: { contents: read }
defaults:
  run:
    shell: bash -eo pipefail {0}
    working-directory: ios
jobs:
  build:
    # GitHub's xcode-27 image (a preview): Xcode 27.1, the first SDK the iPhone Duo gives its whole displays to (an
    # app built with the iOS 26 SDK sits in a smaller window on it).
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    concurrency: { group: "ios-${{ inputs.device || 'iPhone 17' }}-${{ inputs.appearance || 'light' }}", cancel-in-progress: false }
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode, xcodegen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./xcode.sh
      - name: Phone replica (simulator, every flow)
        timeout-minutes: 25
        env:
          DEVICE: ${{ inputs.device || 'iPhone 17' }}
          APPEARANCE: ${{ inputs.appearance || 'light' }}
        run: ./replica.sh
      - name: Keep the replica screenshots and log
        if: always()
        continue-on-error: true   # a GitHub artifact-storage hiccup never blocks a release
        uses: actions/upload-artifact@v4
        with:
          name: replica-screens-${{ inputs.appearance || 'light' }}
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/screens/replica.mp4
            ${{ runner.temp }}/screens/video-start.txt
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore
      - name: Archive (unsigned)
        if: inputs.upload || (github.event_name == 'push' && github.workflow == 'ios')
        run: |
          xcodebuild archive -project Speedometer.xcodeproj -scheme Speedometer -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1 || true
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" | head -40 || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
      - name: Export, cloud-sign and upload to TestFlight
        if: inputs.upload || (github.event_name == 'push' && github.workflow == 'ios')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"; trap 'rm -f "$KEY"' EXIT
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || true
          grep -E "error|EXPORT|Upload|Uploaded|uploaded" "$RUNNER_TEMP/export.log" | sed "s#$RUNNER_TEMP/##" | tail -n 25 || true
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" "$RUNNER_TEMP/export.log"
  # The launch screen and the native screen against the HTML on the other iPhone sizes, the smallest to the iPhone Duo's
  # two displays (its simulator boots closed, on the 466 x 678 pt outer display).
  sizes:
    if: ${{ !inputs.runner }}   # not when the appstore workflow calls this one
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone 17e, iPhone Air, iPhone 18 Pro Max, iPhone Duo]
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode, xcodegen
        run: ./xcode.sh
      - name: Replica comparisons on ${{ matrix.device }}
        timeout-minutes: 30
        env:
          DEVICE: ${{ matrix.device }}
          APPEARANCE: light
          TESTS: testLaunchScreenMatchesWaiting testMatchesReference
        run: ./replica.sh
      - name: Keep the screenshots and log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sizes-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore
  # The iPhone Duo opened and closed under the running app (Device Hub's pose buttons, ios/duo-host.sh), then the launch
  # screen and the HTML comparisons in the open pose (951 x 669 pt).
  duo:
    if: ${{ !inputs.runner }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode, xcodegen
        run: ./xcode.sh
      - name: Replica on the iPhone Duo, closed and open
        timeout-minutes: 30
        env:
          DEVICE: iPhone Duo
          APPEARANCE: light
          DUO_HOST: "1"
          TESTS: testDuoOpens testLaunchScreenMatchesWaiting testMatchesReference
        run: ./replica.sh
      - name: The real launch screen, closed and open, in each orientation
        if: always()
        timeout-minutes: 15
        run: |
          ./duo-host.sh start > "$RUNNER_TEMP/duo-host2.log" 2>&1 &   # reopens Device Hub if it closed
          sleep 25; ./launch-capture.sh
      - name: Keep the launch videos
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: duo-launch
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore
      - name: Keep the screenshots, videos and log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: duo-open
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/screens/*.mov
            ${{ runner.temp }}/screens/replica.mp4
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/duo-host.log
          if-no-files-found: ignore
