# Finds how the iPhone Duo simulator's hinge is driven on a GitHub runner (Xcode 27.1): the private simulator frameworks'
# and Device Hub's fold/hinge/posture symbols, simctl's full command list, and Device Hub's accessibility tree.
name: duo-probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
defaults:
  run:
    shell: bash -o pipefail {0}
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27.1*.app | sort | tail -1)"; xcodebuild -version
          DEV="$(xcode-select -p)"; echo "DEV=$DEV" >> "$GITHUB_ENV"
          ls "$DEV/Applications" /Applications "$DEV/../Applications" 2>&1 | head -80 || true
      - name: Symbols
        run: |
          OUT="$RUNNER_TEMP/probe"; mkdir -p "$OUT"
          for f in /Library/Developer/PrivateFrameworks/CoreSimulator.framework/CoreSimulator \
                   "$DEV"/Library/PrivateFrameworks/SimulatorKit.framework/SimulatorKit \
                   "$DEV"/Library/PrivateFrameworks/*.framework/* "$DEV"/Applications/*.app/Contents/MacOS/* \
                   "$DEV"/Applications/*.app/Contents/Frameworks/*.framework/*; do
            [ -f "$f" ] && file "$f" | grep -q Mach-O || continue
            m=$(strings -a "$f" | grep -iE 'hinge|posture|fold(ed|State|Angle)|unfold' | sort -u | head -80)
            [ -n "$m" ] && { echo "=== $f"; echo "$m"; } | tee -a "$OUT/symbols.txt"
          done
          find /Applications "$DEV" -maxdepth 4 -iname '*hub*' 2>/dev/null | head
      - name: simctl
        run: |
          OUT="$RUNNER_TEMP/probe"
          xcrun simctl help 2>&1 | tee "$OUT/simctl-help.txt"
          for c in io ui spawn; do echo "--- $c"; xcrun simctl $c 2>&1 | head -40; done | tee -a "$OUT/simctl-help.txt"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;print([d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['name']=='iPhone Duo'][0])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl io "$UDID" enumerate 2>&1 | tee "$OUT/io.txt"
          xcrun simctl spawn "$UDID" launchctl list 2>&1 | grep -iE 'hinge|fold|posture|sensor|backboard' | tee "$OUT/launchd.txt"
      - name: Device Hub, open the Duo
        run: |
          OUT="$RUNNER_TEMP/probe"
          open -a "$DEV/../Applications/DeviceHub.app"; sleep 25
          screencapture -x "$OUT/0-closed.png"
          ax() { osascript -e "tell application \"System Events\" to tell process \"DeviceHub\" to $1" 2>&1 | tr ',' '\n' | head -${2:-300}; }
          { echo "-- windows"; ax "get name of every window"
            echo "-- menus"; ax "get name of every menu item of every menu of menu bar 1"
            echo "-- device menu"; ax "get {name, value of attribute \"AXMenuItemCmdChar\", value of attribute \"AXMenuItemCmdModifiers\"} of every menu item of menu \"Device\" of menu bar 1"
            echo "-- buttons"; ax "get {description, name, help} of every button of every group of every group of window 1" 600
            echo "-- all"; ax "get entire contents of window 1" 800; } > "$OUT/ax.txt"
          # click Open by its AX description if found, else by position (the third pose button in the screenshot)
          ax 'click (first button of entire contents of window 1 whose description is "Open")' > "$OUT/click-ax.txt"
          sleep 6; screencapture -x "$OUT/1-after-ax.png"
          xcrun simctl io "$UDID" screenshot --display=primary "$OUT/sim-primary.png" 2>&1 | tail -2
          cat > "$RUNNER_TEMP/click.swift" <<'SWIFT'
          import CoreGraphics; import Foundation
          let x = Double(CommandLine.arguments[1])!, y = Double(CommandLine.arguments[2])!
          for t in [CGEventType.leftMouseDown, .leftMouseUp] {
            CGEvent(mouseEventSource: nil, mouseType: t, mouseCursorPosition: CGPoint(x: x, y: y), mouseButton: .left)!.post(tap: .cghidEventTap)
            usleep(80000) }
          SWIFT
          swiftc -o "$RUNNER_TEMP/click" "$RUNNER_TEMP/click.swift" && "$RUNNER_TEMP/click" 743 679
          sleep 6; screencapture -x "$OUT/2-after-click.png"
          for d in primary primary-1 external; do xcrun simctl io "$UDID" screenshot --display=$d "$OUT/sim-$d.png" 2>&1 | tail -1; done
          sips -g pixelWidth -g pixelHeight "$OUT"/sim-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: duo-probe, path: "${{ runner.temp }}/probe" }
